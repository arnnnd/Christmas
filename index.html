<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Festive Countdown 2026-2027</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;600;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://unpkg.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        xmasRed: '#991B1B',
                        xmasGreen: '#166534',
                        gold: '#F59E0B',
                        brightGold: '#FBBF24',
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                        script: ['Great Vibes', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        /* TV Strict Fullscreen No-Scroll Lock */
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            touch-action: none;
            user-select: none;
            background: #03080c;
            font-family: 'Montserrat', sans-serif;
            color: #f8fafc;
        }

        /* TV Glassmorphism Panels */
        .tv-glass {
            background: #0c1821; /* Solid fallback for 2014 engines missing opacity hex */
            background: rgba(12, 24, 33, 0.85);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
        }

        .gold-border {
            border-color: rgba(245, 158, 11, 0.6);
        }

        .gold-glow {
            -webkit-text-shadow: 0 0 20px rgba(245, 158, 11, 0.8), 0 0 40px rgba(245, 158, 11, 0.4);
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.8), 0 0 40px rgba(245, 158, 11, 0.4);
        }

        .red-glow {
            -webkit-text-shadow: 0 0 20px rgba(239, 68, 68, 0.8), 0 0 40px rgba(239, 68, 68, 0.4);
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.8), 0 0 40px rgba(239, 68, 68, 0.4);
        }

        /* Dynamic Canvas Layer */
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        /* Ticker Marquee Animation */
        @-webkit-keyframes tickerAnimation {
            0% { -webkit-transform: translateX(100vw); transform: translateX(100vw); }
            100% { -webkit-transform: translateX(-100%); transform: translateX(-100%); }
        }
        @keyframes tickerAnimation {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
        .animate-ticker {
            display: inline-block;
            white-space: nowrap;
            -webkit-animation: tickerAnimation 30s linear infinite;
            animation: tickerAnimation 30s linear infinite;
        }
    </style>
</head>
<body class="relative w-vw h-vh flex flex-col justify-between p-4 md:p-6 lg:p-8 select-none">

    <!-- Canvas for Snowfall & Fireworks -->
    <canvas id="fxCanvas"></canvas>

    <!-- Header Section (Top TV Bar) -->
    <header class="w-full flex justify-between items-center z-20 shrink-0 tv-glass rounded-2xl px-6 py-3">
        <!-- Logo / Title -->
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-500 via-red-600 to-emerald-600 flex items-center justify-center shadow-lg shadow-amber-500/30">
                <i data-lucide="sparkles" class="w-7 h-7 text-white"></i>
            </div>
            <div>
                <h1 class="font-cinzel text-2xl lg:text-3xl font-black tracking-wider text-amber-300 gold-glow">GRAND HOLIDAY COUNTDOWN</h1>
                <p class="text-xs lg:text-sm text-emerald-300 font-semibold tracking-widest uppercase">Specially Crafted for 65" TV Display</p>
            </div>
        </div>

        <!-- Mode & Audio TV Controls -->
        <div class="flex items-center gap-4">
            <!-- Ambience Toggle -->
            <button id="audioBtn" onclick="toggleAudio()" class="px-5 py-2.5 rounded-full tv-glass hover:bg-white/10 transition-all flex items-center gap-3 text-sm font-semibold border border-amber-500/40 text-amber-200">
                <i id="audioIcon" data-lucide="volume-x" class="w-5 h-5 text-amber-400"></i>
                <span id="audioText">Ambience: OFF</span>
            </button>

            <!-- Mode Selector Switcher -->
            <div class="flex bg-black/60 p-1.5 rounded-full border border-white/20">
                <button id="btnDual" onclick="setMode('dual')" class="px-5 py-2 rounded-full text-xs lg:text-sm font-bold transition-all bg-amber-500 text-slate-950 shadow-md">
                    ✨ Dual View
                </button>
                <button id="btnXmas" onclick="setMode('xmas')" class="px-5 py-2 rounded-full text-xs lg:text-sm font-bold transition-all text-slate-300 hover:text-white">
                    🎄 Christmas
                </button>
                <button id="btnNY" onclick="setMode('ny')" class="px-5 py-2 rounded-full text-xs lg:text-sm font-bold transition-all text-slate-300 hover:text-white">
                    🎆 New Year
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid Container (Fills TV Screen perfectly) -->
    <main id="mainGrid" class="grid grid-cols-2 gap-6 my-auto z-20 flex-grow py-4 h-full max-h-[calc(100vh-160px)] items-center">
        
        <!-- CHRISTMAS 2026 CARD -->
        <div id="panelXmas" class="tv-glass rounded-3xl p-6 lg:p-8 flex flex-col justify-between h-full border-t-4 border-t-red-600 gold-border transition-all duration-500">
            <!-- Title Header -->
            <div class="text-center">
                <span class="font-script text-2xl lg:text-3xl text-amber-400 block">Season's Magic</span>
                <h2 class="font-cinzel text-3xl lg:text-5xl font-black text-amber-300 red-glow">
                    CHRISTMAS 2026
                </h2>
                <p class="text-xs lg:text-sm text-slate-300 uppercase tracking-widest mt-1 font-semibold">Friday, December 25, 2026</p>
            </div>

            <!-- Numbers Grid -->
            <div class="flex justify-around items-center my-auto w-full">
                <div class="bg-black/60 rounded-2xl p-4 text-center border border-white/10 w-1/5">
                    <span id="xmas-days" class="font-cinzel text-4xl lg:text-6xl font-black text-amber-300 block">00</span>
                    <span class="text-[10px] lg:text-xs font-bold uppercase tracking-wider text-slate-400">Days</span>
                </div>
                <div class="bg-black/60 rounded-2xl p-4 text-center border border-white/10 w-1/5">
                    <span id="xmas-hours" class="font-cinzel text-4xl lg:text-6xl font-black text-red-400 block">00</span>
                    <span class="text-[10px] lg:text-xs font-bold uppercase tracking-wider text-slate-400">Hours</span>
                </div>
                <div class="bg-black/60 rounded-2xl p-4 text-center border border-white/10 w-1/5">
                    <span id="xmas-mins" class="font-cinzel text-4xl lg:text-6xl font-black text-emerald-400 block">00</span>
                    <span class="text-[10px] lg:text-xs font-bold uppercase tracking-wider text-slate-400">Mins</span>
                </div>
                <div class="bg-black/60 rounded-2xl p-4 text-center border border-white/10 w-1/5">
                    <span id="xmas-secs" class="font-cinzel text-4xl lg:text-6xl font-black text-amber-200 block">00</span>
                    <span class="text-[10px] lg:text-xs font-bold uppercase tracking-wider text-slate-400">Secs</span>
                </div>
            </div>

            <!-- Subtitle/Footer Tag -->
            <div class="flex items-center justify-center gap-2 text-xs lg:text-sm text-amber-300/80 font-cinzel font-bold">
                <i data-lucide="gift" class="w-4 h-4 text-amber-400"></i>
                <span id="xmas-message">COUNTING DOWN TO PEACE, WARMTH, AND HOLIDAY JOY</span>
            </div>
        </div>

        <!-- NEW YEAR 2027 CARD -->
        <div id="panelNY" class="tv-glass rounded-3xl p-6 lg:p-8 flex flex-col justify-between h-full border-t-4 border-t-amber-500 gold-border transition-all duration-500">
            <!-- Title Header -->
            <div class="text-center">
                <span class="font-script text-2xl lg:text-3xl text-amber-400 block">A Grand New Dawn</span>
                <h2 class="font-cinzel text-3xl lg:text-5xl font-black text-amber-400 gold-glow">
                    NEW YEAR 2027
                </h2>
                <p class="text-xs lg:text-sm text-slate-300 uppercase tracking-widest mt-1 font-semibold">Friday, January 1, 2027</p>
            </div>

            <!-- Numbers Grid -->
            <div class="flex justify-around items-center my-auto w-full">
                <div class="bg-black/60 rounded-2xl p-4 text-center border border-white/10 w-1/5">
                    <span id="ny-days" class="font-cinzel text-4xl lg:text-6xl font-black text-amber-300 block">00</span>
